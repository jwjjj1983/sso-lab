[project]
name = "sso-lab"
version = "0.1.0"
description = "SSO Lab backend: teaching IdP, demo relying parties, and the lab trace recorder"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-cloud-firestore>=2.32.0",
    "httpx>=0.28.1",
    "joserfc>=1.7.5",
    "lxml>=6.1.3",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "signxml>=5.1.0",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["firestore: needs FIRESTORE_EMULATOR_HOST"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC110"]
# Throwaway demo credentials, checked in on purpose.
"src/sso_lab/demo.py" = ["S105", "S106"]
